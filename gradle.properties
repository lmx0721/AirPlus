# Gradle build acceleration
org.gradle.java.home=C\:\\Program Files\\Java\\jdk-17
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
# Architectury Loom needs JDK 17+; Java 8 is provided via toolchain (foojay)
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.vfs.watch=true

# Architectury Loom (forge platform)
loom.platform=forge

# Project coordinates (referenced by build.gradle.kts)
baseGroup=net.airplus
mcVersion=1.8.9
modid=airplus
version=b2

# Kotlin
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2g
kotlin_version=2.0.21
kotlin_coroutines_version=1.10.1