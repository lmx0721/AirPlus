name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Gradle / Architectury Loom must run on JDK 17;
      # the Java 8 compile toolchain is auto-provisioned by the foojay resolver.
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
          cache: "gradle"

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Package artifact
        run: |
          mkdir -p zip
          JAR=$(find build/libs -iregex '.*airplus-b[0-9|.]*\.jar' | head -n 1)
          echo "Jar: $JAR"
          cp "$JAR" zip/airplus.jar
          cd zip
          zip -r airplus.zip airplus.jar
          md5sum airplus.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: airplus
          path: zip/airplus.zip

      # Only main-branch pushes are published as a rolling pre-release
      # (PR builds just produce the downloadable workflow artifact above).
      - name: Publish pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete pre-release --cleanup-tag -y || true
          gh release create pre-release zip/airplus.zip \
            --prerelease \
            --title "AirPlus CI #${{ github.run_number }}" \
            --notes "Automatic build of commit ${{ github.sha }} (branch: ${{ github.ref_name }})"
